<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="主流电脑软件官方网站导航，收录 Windows / macOS / Linux 常用软件的官方主页，支持即时搜索与分类筛选。">
<title>软件官网导航 · 电脑软件官方网址合集</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#15181e;
    --muted:#616a7a;
    --border:#e2e6ee;
    --border-strong:#cfd6e3;
    --accent:#2f6bff;
    --accent-soft:#e9f0ff;
    --mark:#ffe98a;
    --mark-text:#2a2200;
    --header:rgba(244,246,250,.78);
    --side-bg:#eceff5;
    --side-hover:rgba(16,24,40,.055);
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 26px -16px rgba(16,24,40,.35);
    --shadow-hover:0 2px 4px rgba(16,24,40,.06), 0 18px 34px -18px rgba(16,24,40,.42);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c0e13;
      --card:#151922;
      --text:#e9ecf3;
      --muted:#95a0b4;
      --border:#232936;
      --border-strong:#313a4c;
      --accent:#7ba5ff;
      --accent-soft:#18233b;
      --mark:#6b5500;
      --mark-text:#fff6cc;
      --header:rgba(12,14,19,.76);
      --side-bg:#101420;
      --side-hover:rgba(255,255,255,.07);
      --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 28px -18px rgba(0,0,0,.8);
      --shadow-hover:0 2px 6px rgba(0,0,0,.5), 0 20px 38px -20px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0e13;
    --card:#151922;
    --text:#e9ecf3;
    --muted:#95a0b4;
    --border:#232936;
    --border-strong:#313a4c;
    --accent:#7ba5ff;
    --accent-soft:#18233b;
    --mark:#6b5500;
    --mark-text:#fff6cc;
    --header:rgba(12,14,19,.76);
    --side-bg:#101420;
    --side-hover:rgba(255,255,255,.07);
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 28px -18px rgba(0,0,0,.8);
    --shadow-hover:0 2px 6px rgba(0,0,0,.5), 0 20px 38px -20px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent-soft)}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--header);
    backdrop-filter:saturate(160%) blur(12px);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1240px;margin:0 auto;padding:14px 20px;
    display:flex;flex-wrap:wrap;align-items:center;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:32px;height:32px;border-radius:9px;flex:none;
    display:grid;place-items:center;
    background:linear-gradient(140deg,#3b7bff,#7a4dff);
    color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;
    box-shadow:0 4px 12px -4px rgba(59,123,255,.65);
  }
  .brand h1{font-size:16.5px;margin:0;letter-spacing:.2px;white-space:nowrap}
  .brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;display:none}
  @media (min-width:900px){.brand .sub{display:block}}

  .search-wrap{position:relative;flex:1 1 320px;max-width:520px;margin-left:auto}
  .search-box{
    display:flex;align-items:center;gap:8px;
    height:42px;padding:0 10px 0 12px;
    background:var(--card);
    border:1px solid var(--border-strong);
    border-radius:12px;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-box svg{flex:none;color:var(--muted)}
  #q{
    flex:1 1 auto;min-width:0;height:100%;
    border:0;outline:0;background:transparent;color:var(--text);
    font:inherit;font-size:14.5px;
  }
  #q::placeholder{color:var(--muted)}
  .kbd{
    flex:none;font-family:var(--mono);font-size:11px;color:var(--muted);
    border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:6px;
    padding:1px 5px;background:var(--bg);
  }
  @media (max-width:640px){.kbd{display:none}}
  #clearBtn{
    flex:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
    font-size:16px;line-height:1;padding:4px 2px;border-radius:6px;
  }
  #clearBtn:hover{color:var(--text)}
  #clearBtn[hidden]{display:none}

  .theme-btn{
    flex:none;width:42px;height:42px;border-radius:12px;cursor:pointer;
    background:var(--card);border:1px solid var(--border-strong);color:var(--text);
    display:grid;place-items:center;transition:border-color .15s,transform .15s;
  }
  .theme-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
  .theme-btn:active{transform:translateY(0)}

  main{
    max-width:1240px;margin:0 auto;padding:0 20px 40px;
    display:grid;grid-template-columns:228px minmax(0,1fr);
    gap:26px;align-items:start;
  }
  .content{min-width:0}
  .hero{padding:22px 2px 4px}
  .hero h2{margin:0 0 6px;font-size:26px;line-height:1.25;letter-spacing:-.4px}
  .hero p{margin:0;color:var(--muted);font-size:13.5px;max-width:780px}
  .hero p strong{color:var(--text);font-weight:600}

  .meta{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    padding:14px 2px 0;font-size:12.5px;color:var(--muted);
  }
  .dot{width:4px;height:4px;border-radius:50%;background:var(--border-strong)}
  #resultInfo{font-variant-numeric:tabular-nums}

  /* 左侧分类导航 */
  .sidebar{
    position:sticky;top:78px;
    max-height:calc(100vh - 96px);
    margin-top:22px;
    padding:12px 10px 10px;
    background:var(--side-bg);
    border:1px solid var(--border);
    border-radius:14px;
    overflow-y:auto;
    overscroll-behavior:contain;
    scrollbar-width:thin;
    scrollbar-color:var(--border-strong) transparent;
  }
  .sidebar::-webkit-scrollbar{width:8px}
  .sidebar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
  .sidebar::-webkit-scrollbar-track{background:transparent}
  .side-title{
    padding:4px 10px 9px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);
  }
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-item{
    position:relative;display:flex;align-items:center;gap:9px;
    width:100%;padding:8px 10px;border:0;border-radius:9px;
    background:transparent;color:var(--muted);
    font:inherit;font-size:13px;line-height:1.45;text-align:left;cursor:pointer;
    transition:background .14s,color .14s;
  }
  .side-item:hover{background:var(--side-hover);color:var(--text)}
  .side-item[aria-current="true"]{
    background:var(--accent-soft);color:var(--accent);font-weight:650;
  }
  .side-item[aria-current="true"]::before{
    content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    border-radius:0 3px 3px 0;background:var(--accent);
  }
  .side-item .ico{flex:none;width:17px;text-align:center;font-size:13px}
  .side-item .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-item .cnt{
    margin-left:auto;flex:none;font-family:var(--mono);font-size:10.5px;
    padding:1px 6px;border-radius:999px;
    background:var(--card);border:1px solid var(--border);color:var(--muted);
  }
  .side-item[aria-current="true"] .cnt{background:var(--accent);border-color:var(--accent);color:#fff}
  .side-item.is-zero{opacity:.42}
  .side-foot{
    margin-top:8px;padding:10px 10px 2px;border-top:1px solid var(--border);
    font-family:var(--mono);font-size:11px;color:var(--muted);
  }

  @media (max-width:900px){
    main{display:block;padding:0 14px 32px}
    .sidebar{
      position:static;max-height:none;margin:12px 0 0;
      padding:8px;border-radius:12px;overflow:visible;
    }
    .side-title,.side-foot{display:none}
    .side-nav{
      flex-direction:row;gap:6px;padding:2px;
      overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    }
    .side-nav::-webkit-scrollbar{display:none}
    .side-item{
      flex:0 0 auto;width:auto;padding:6px 11px;border-radius:999px;
      border:1px solid var(--border);background:var(--card);font-size:12.5px;
    }
    .side-item[aria-current="true"]{border-color:var(--accent)}
    .side-item[aria-current="true"]::before{display:none}
  }

  .grid-section{margin-top:22px}
  .sec-head{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:0 2px}
  .sec-head .emoji{font-size:15px}
  .sec-head h3{margin:0;font-size:13.5px;font-weight:650;letter-spacing:.2px}
  .sec-head .line{flex:1 1 auto;height:1px;background:var(--border)}
  .sec-head .num{font-family:var(--mono);font-size:11px;color:var(--muted)}

  .grid{
    display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
  }
  @media (max-width:600px){
    .grid{grid-template-columns:1fr}
    main{padding:0 14px 32px}
    .topbar-inner{padding:12px 14px;gap:10px}
    .hero h2{font-size:21px}
    .hero{padding-top:18px}
    .search-wrap{flex:1 1 100%;max-width:none;order:3;margin-left:0}
  }

  .card{
    display:flex;flex-direction:column;gap:10px;
    padding:14px 14px 12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    position:relative;overflow:hidden;
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:14px;
    border:1px solid transparent;pointer-events:none;
    transition:border-color .16s;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-3px);
    box-shadow:var(--shadow-hover);
    outline:none;
  }
  .card:hover::after,.card:focus-visible::after{border-color:var(--accent)}
  .card:active{transform:translateY(-1px)}

  .card-top{display:flex;align-items:flex-start;gap:10px}
  .mono-mark{
    flex:none;width:36px;height:36px;border-radius:10px;
    display:grid;place-items:center;
    font-weight:750;font-size:15px;font-family:var(--mono);
    background:hsl(var(--h) 78% 94%);
    color:hsl(var(--h) 55% 34%);
    border:1px solid hsl(var(--h) 60% 88%);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .mono-mark{
      background:hsl(var(--h) 45% 20%);
      color:hsl(var(--h) 75% 76%);
      border-color:hsl(var(--h) 35% 30%);
    }
  }
  :root[data-theme="dark"] .mono-mark{
    background:hsl(var(--h) 45% 20%);
    color:hsl(var(--h) 75% 76%);
    border-color:hsl(var(--h) 35% 30%);
  }

  .names{min-width:0;flex:1 1 auto}
  .names h4{
    margin:0;font-size:14.5px;font-weight:650;letter-spacing:.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .names .en{
    display:block;margin-top:1px;font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .arrow{
    flex:none;color:var(--muted);font-size:13px;opacity:0;
    transform:translate(-2px,2px);transition:opacity .16s,transform .16s;
  }
  .card:hover .arrow{opacity:1;transform:translate(0,0);color:var(--accent)}

  .desc{
    margin:0;font-size:12.8px;line-height:1.55;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;min-height:40px;
  }
  .card-foot{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding-top:8px;border-top:1px dashed var(--border);
    margin-top:auto;
  }
  .plat{
    font-family:var(--mono);font-size:10px;letter-spacing:.3px;
    padding:1px 5px;border-radius:5px;
    color:var(--muted);background:var(--bg);
    border:1px solid var(--border);
  }
  .dom{
    margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);
    max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .note{
    font-size:10px;color:#b45309;
    background:#fef3c7;border:1px solid #fcd34d;
    padding:1px 5px;border-radius:5px;white-space:nowrap;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .note{background:#3a2a08;border-color:#6b4d0d;color:#fbbf24}
  }
  :root[data-theme="dark"] .note{background:#3a2a08;border-color:#6b4d0d;color:#fbbf24}

  mark{
    background:var(--mark);color:var(--mark-text);
    border-radius:3px;padding:0 1px;font-weight:600;
  }

  #empty{display:none;text-align:center;padding:64px 20px 40px;color:var(--muted)}
  #empty.show{display:block}
  #empty .big{font-size:38px;line-height:1;margin-bottom:12px;opacity:.85}
  #empty h5{margin:0 0 6px;color:var(--text);font-size:15px;font-weight:650}
  #empty p{margin:0 0 16px;font-size:13px}
  #empty button{
    font:inherit;font-size:13px;cursor:pointer;
    padding:7px 16px;border-radius:9px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
  }
  #empty button:hover{border-color:var(--accent);color:var(--accent)}

  footer{border-top:1px solid var(--border);margin-top:18px;color:var(--muted);font-size:12px}
  .foot-inner{
    max-width:1240px;margin:0 auto;padding:18px 20px 34px;
    display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:space-between;
  }
  .foot-inner span{line-height:1.7}
  .kbd-note{font-family:var(--mono)}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo">SW</span>
      <h1>软件官网导航</h1>
      <span class="sub">只收录官方站点</span>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
        </svg>
        <input id="q" type="text" inputmode="search" autocomplete="off" spellcheck="false"
               placeholder="搜索软件名、简介、分类或域名…" aria-label="搜索软件">
        <span class="kbd" id="kbdHint">Ctrl K</span>
        <button id="clearBtn" type="button" title="清空搜索（Esc）" aria-label="清空搜索" hidden>✕</button>
      </div>
    </div>

    <button class="theme-btn" id="themeBtn" type="button" title="切换主题（跟随系统 / 浅色 / 深色）" aria-label="切换主题"></button>
  </div>
</header>

<main>
  <aside class="sidebar">
    <div class="side-title">分类导航</div>
    <nav class="side-nav" id="chips" aria-label="分类筛选"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <div class="content">
    <div class="hero">
      <h2>常用电脑软件，直达官方网站（收录 <strong id="heroCount">0</strong> 款）</h2>
    </div>

    <div class="meta">
      <span id="resultInfo">共 0 款</span>
      <span class="dot"></span>
      <span>点击卡片即在新标签页打开官网</span>
      <span class="dot"></span>
      <span>校对于 2026-10-31</span>
    </div>

    <section id="grid" aria-live="polite"></section>

    <div id="empty">
      <div class="big">🔍</div>
      <h5>没有找到匹配的软件</h5>
      <p>换个关键词试试，例如「浏览器」「剪辑」「Adobe」，或清除分类筛选。</p>
      <button type="button" id="resetBtn">清空搜索与筛选</button>
    </div>
  </div>
</main>

<footer>
  <div class="foot-inner">
    <span>说明：本页仅做官方网址索引，软件版权归各厂商所有；链接均为厂商官网，不含推广与下载站。</span>
    <span>快捷键：<span class="kbd-note">Ctrl / ⌘ + K</span> 聚焦搜索 · <span class="kbd-note">Esc</span> 清空</span>
  </div>
</footer>

<script>
/* 分类 */
const CATS = [
  { key:'browser', name:'浏览器',         icon:'🌐' },
  { key:'office',  name:'办公与文档',     icon:'📄' },
  { key:'dev',     name:'开发工具',       icon:'💻' },
  { key:'sci',     name:'科学与工程',     icon:'🔬' },
  { key:'design',  name:'设计与创意',     icon:'🎨' },
  { key:'media',   name:'影音播放与转换', icon:'🎬' },
  { key:'comm',    name:'沟通与协作',     icon:'💬' },
  { key:'cloud',   name:'云盘与同步',     icon:'☁️' },
  { key:'sec',     name:'安全与隐私',     icon:'🛡️' },
  { key:'zip',     name:'压缩与解压',     icon:'🗜️' },
  { key:'sys',     name:'系统与驱动',     icon:'⚙️' },
  { key:'vm',      name:'虚拟机与远程',   icon:'🖥️' },
  { key:'ime',     name:'输入法与翻译',   icon:'⌨️' },
  { key:'dl',      name:'下载工具',       icon:'⬇️' },
  { key:'game',    name:'游戏平台',       icon:'🎮' },
  { key:'util',    name:'效率小工具',     icon:'🧰' }
];

/* 数据：c 分类 / n 中文名 / e 英文名 / d 简介 / p 平台 / u 官方链接 / dom 域名 / note 大陆访问受限备注 */

/* ── 基础工具 ── */
const PLAT_LABEL = { W:'Win', M:'Mac', L:'Linux' };
const CAT_MAP = Object.fromEntries(CATS.map(c => [c.key, c]));
const $ = id => document.getElementById(id);
const grid = $('grid'), chips = $('chips'), q = $('q');
const emptyBox = $('empty'), resultInfo = $('resultInfo'), clearBtn = $('clearBtn');

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escRe(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function hashHue(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}
function initials(item){
  const s = item.e.replace(/^(Adobe|Microsoft|Google|Mozilla|Tencent)\s+/i, '').trim();
  return (s[0] || '?').toUpperCase();
}
function searchBlob(item){
  return [
    item.n, item.e, item.d, CAT_MAP[item.c].name, item.c, item.dom, item.u,
    item.p.split('').map(p => PLAT_LABEL[p]).join(' '),
    item.note ? '受限 需代理' : ''
  ].join(' ').toLowerCase();
}
DATA.forEach(d => { d._blob = searchBlob(d); });

/* ── 状态 ── */
let activeCat = 'all';
let tokens = [];
let query = '';

function buildTokens(){
  query = q.value.trim();
  tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
  tokens.sort((a, b) => b.length - a.length);
}

function highlight(text){
  if (!tokens.length) return esc(text);
  const re = new RegExp('(' + tokens.map(escRe).join('|') + ')', 'gi');
  return text.split(re).map((part, i) =>
    i % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part)
  ).join('');
}

function scoreOf(item){
  if (!tokens.length) return 0;
  const blob = item._blob;
  for (const t of tokens) if (!blob.includes(t)) return -1;
  let score = 0;
  const name = item.n.toLowerCase(), en = item.e.toLowerCase(), dom = item.dom.toLowerCase();
  for (const t of tokens){
    if (name.startsWith(t)) score += 6;
    else if (name.includes(t)) score += 4;
    else if (en.startsWith(t)) score += 5;
    else if (en.includes(t)) score += 3;
    else if (dom.includes(t)) score += 2;
    else score += 1;
  }
  return score;
}

function cardHTML(item, hl){
  const cat = CAT_MAP[item.c];
  const hue = hashHue(item.e);
  const plats = item.p.split('').map(p => '<span class="plat">' + PLAT_LABEL[p] + '</span>').join('');
  const note = item.note
    ? '<span class="note" title="该官网在中国大陆访问可能需要网络工具，链接仍为官方站点">⚠ 受限</span>'
    : '';
  return '<a class="card" href="' + esc(item.u) + '" target="_blank" rel="noopener noreferrer" '
    + 'aria-label="打开 ' + esc(item.n) + ' 官网（新标签页）">'
    +   '<div class="card-top">'
    +     '<span class="mono-mark" style="--h:' + hue + '">' + esc(initials(item)) + '</span>'
    +     '<div class="names"><h4>' + (hl ? highlight(item.n) : esc(item.n)) + '</h4>'
    +       '<span class="en">' + (hl ? highlight(item.e) : esc(item.e)) + '</span></div>'
    +     '<span class="arrow" aria-hidden="true">↗</span>'
    +   '</div>'
    +   '<p class="desc">' + (hl ? highlight(item.d) : esc(item.d)) + '</p>'
    +   '<div class="card-foot">' + plats + note
    +     '<span class="dom" title="' + esc(item.u) + '">' + (hl ? highlight(item.dom) : esc(item.dom)) + '</span>'
    +   '</div>'
    + '</a>';
}

/* ── 渲染 ── */
function render(){
  buildTokens();
  const hl = tokens.length > 0;
  let total = 0;
  let html = '';

  /* 先按关键词统计各分类命中数（不受当前分类限制），再按分类过滤 */
  const matched = {};
  let matchedAll = 0;
  for (const cat of CATS){
    matched[cat.key] = DATA.filter(item => item.c === cat.key && scoreOf(item) >= 0).length;
    matchedAll += matched[cat.key];
  }

  for (const cat of CATS){
    if (activeCat !== 'all' && activeCat !== cat.key) continue;
    const list = DATA.filter(item => item.c === cat.key)
      .map(item => ({ item, score: scoreOf(item) }))
      .filter(x => x.score >= 0)
      .sort((a, b) => b.score - a.score);
    if (!list.length) continue;

    total += list.length;
    html += '<section class="grid-section">'
      +   '<div class="sec-head"><span class="emoji" aria-hidden="true">' + cat.icon + '</span>'
      +   '<h3>' + cat.name + '</h3><div class="line"></div>'
      +   '<span class="num">' + list.length + '</span></div>'
      +   '<div class="grid">' + list.map(x => cardHTML(x.item, hl)).join('') + '</div>'
      + '</section>';
  }

  grid.innerHTML = total ? html : '';
  emptyBox.classList.toggle('show', total === 0);

  resultInfo.textContent = (tokens.length || activeCat !== 'all')
    ? '匹配 ' + total + ' 款 / 共 ' + DATA.length + ' 款'
    : '共 ' + DATA.length + ' 款软件';
  clearBtn.hidden = !tokens.length;

  updateSide(matched, matchedAll);
}

/* 侧栏计数与选中态 */
function updateSide(matched, matchedAll){
  const allCount = tokens.length ? matchedAll : DATA.length;
  chips.querySelectorAll('.side-item').forEach(btn => {
    const k = btn.dataset.cat;
    const n = k === 'all' ? allCount : matched[k];
    const cnt = btn.querySelector('.cnt');
    if (cnt) cnt.textContent = n;
    btn.classList.toggle('is-zero', tokens.length > 0 && k !== 'all' && n === 0);
    btn.setAttribute('aria-current', k === activeCat ? 'true' : 'false');
  });
}

/* ── 左侧分类导航 ── */
function initNav(){
  const counts = {};
  DATA.forEach(d => { counts[d.c] = (counts[d.c] || 0) + 1; });

  const item = (key, icon, name, n, current) =>
    '<button class="side-item" type="button" data-cat="' + key + '" aria-current="' + current + '">'
    + '<span class="ico" aria-hidden="true">' + icon + '</span>'
    + '<span class="label">' + name + '</span>'
    + '<span class="cnt">' + n + '</span></button>';

  chips.innerHTML = item('all', '▦', '全部', DATA.length, 'true')
    + CATS.map(c => item(c.key, c.icon, c.name, counts[c.key] || 0, 'false')).join('');

  const foot = $('sideFoot');
  if (foot) foot.textContent = CATS.length + ' 个分类 · ' + DATA.length + ' 款';

  chips.addEventListener('click', e => {
    const btn = e.target.closest('.side-item');
    if (!btn) return;
    activeCat = btn.dataset.cat;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

/* ── 搜索交互 ── */
q.addEventListener('input', render);
q.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    e.preventDefault();
    resetAll();
    q.blur();
  } else if (e.key === 'Enter'){
    const first = grid.querySelector('.card');
    if (first) window.open(first.getAttribute('href'), '_blank', 'noopener,noreferrer');
  }
});

clearBtn.addEventListener('click', () => { q.value = ''; render(); q.focus(); });
$('resetBtn').addEventListener('click', () => { resetAll(); q.focus(); });

function resetAll(){
  q.value = '';
  activeCat = 'all';
  render();
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'k'){
    e.preventDefault();
    q.focus();
    q.select();
  } else if (e.key === '/' && document.activeElement !== q){
    e.preventDefault();
    q.focus();
  }
});

if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)){
  $('kbdHint').textContent = '⌘ K';
}

/* ── 主题：auto → light → dark ── */
const THEME_KEY = 'sw-nav-theme';
const ORDER = ['auto', 'light', 'dark'];
const ICONS = {
  auto:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.2"></circle><path d="M12 3.8v16.4"></path></svg>',
  light:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.6v2M12 19.4v2M4.4 12h-2M21.6 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7 4.9 19.1M19.1 4.9l-1.4 1.4"></path></svg>',
  dark:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 13.4A9 9 0 1 1 10.6 3a7 7 0 0 0 10.4 10.4z"></path></svg>'
};
const themeBtn = $('themeBtn');

function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  themeBtn.innerHTML = ICONS[mode];
  themeBtn.title = mode === 'auto' ? '主题：跟随系统（点击切换）' : mode === 'light' ? '主题：浅色（点击切换）' : '主题：深色（点击切换）';
  try { localStorage.setItem(THEME_KEY, mode); } catch(e){}
}
let themeMode = 'auto';
try { themeMode = localStorage.getItem(THEME_KEY) || 'auto'; } catch(e){}
if (!ORDER.includes(themeMode)) themeMode = 'auto';
applyTheme(themeMode);

themeBtn.addEventListener('click', () => {
  themeMode = ORDER[(ORDER.indexOf(themeMode) + 1) % ORDER.length];
  applyTheme(themeMode);
});

/* ── 启动 ── */
$('heroCount').textContent = DATA.length;
initNav();
render();
</script>
